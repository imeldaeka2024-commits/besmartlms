<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>EduSmart LMS</title>
<style>
:root{--primary:#284b9b;--primary2:#4269c6;--ink:#182338;--muted:#68758b;--line:#e4e9f2;--bg:#f5f7fb;--card:#fff;--good:#16835d;--warn:#b7791f;--bad:#c2414b;--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:650;transition:.15s}button:hover{filter:brightness(.96);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:var(--primary);color:white}.secondary{background:#edf2ff;color:var(--primary)}.danger{background:#fff0f0;color:var(--bad)}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.small{padding:7px 10px;font-size:12px}.muted{color:var(--muted)}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 5px 18px #1c315008}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,46px);line-height:1.08;letter-spacing:-1.3px}h2{font-size:22px;letter-spacing:-.4px;margin-bottom:14px}h3{font-size:16px;margin-bottom:8px}p{line-height:1.6}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--primary)}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:750;color:#48556b}.field input,.field select,.field textarea,input,select,textarea{width:100%;border:1px solid #dce3ef;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7793df;box-shadow:0 0 0 3px #4269c619}textarea{resize:vertical;min-height:90px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750;background:#edf2ff;color:var(--primary)}.pill.good{background:#e8f7f0;color:var(--good)}.pill.warn{background:#fff5dd;color:var(--warn)}.pill.bad{background:#fff0f0;color:var(--bad)}.stat{font-size:29px;font-weight:800;letter-spacing:-1px;margin:7px 0}.stat-label{color:var(--muted);font-size:12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand-mark{height:38px;width:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#7195f0);color:white;display:grid;place-items:center;font-size:18px}.top-actions{display:flex;gap:8px;align-items:center}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 69px)}.sidebar{padding:20px 14px;background:#fff;border-right:1px solid var(--line)}.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#98a2b4;font-weight:800;padding:12px 10px 7px}.navbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;color:#58647a;padding:11px 12px;margin:2px 0}.navbtn.active,.navbtn:hover{background:#edf2ff;color:var(--primary)}.navicon{width:22px;text-align:center}.main{padding:26px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.page-head p{margin-bottom:0;color:var(--muted)}.section{margin-bottom:22px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:540px;background:white}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8faff;color:#65718a;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:var(--muted);background:#fafbfe;border:1px dashed #d8e0ee;border-radius:13px}.notice{padding:12px 14px;background:#eef4ff;border:1px solid #d9e5ff;color:#314c83;border-radius:12px;font-size:13px;line-height:1.55}.notice.warn{background:#fff8e7;border-color:#f5e1ac;color:#77531b}.notice.good{background:#eaf8f1;border-color:#c8ebdb;color:#17684c}.login-page{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:#fff}.hero{position:relative;min-height:100vh;background:linear-gradient(120deg,#172c61d9,#3455a8a8),var(--hero-bg,linear-gradient(135deg,#233d7d,#7a9ce8));background-size:cover;background-position:center;color:white;padding:clamp(28px,6vw,78px);display:flex;flex-direction:column;justify-content:space-between}.hero h1{max-width:650px;margin:20px 0}.hero p{max-width:520px;color:#eef3ff}.hero-badge{display:inline-flex;border:1px solid #ffffff55;background:#ffffff18;padding:8px 12px;border-radius:999px;font-size:12px;width:max-content}.hero-foot{font-size:12px;color:#e2eaff}.login-panel{display:flex;align-items:center;justify-content:center;padding:30px}.login-box{width:min(100%,420px)}.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#f0f3f9;padding:5px;border-radius:13px;margin:22px 0}.role-tab{background:transparent;color:#65718a;padding:10px 5px;font-size:12px}.role-tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px #15264d10}.login-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.footer-note{font-size:11px;color:#8a95a8;margin-top:22px;line-height:1.5}.bar-chart{display:flex;align-items:end;gap:10px;height:170px;padding:10px 8px 0;border-bottom:1px solid var(--line)}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:6px;min-width:0}.bar{width:min(42px,75%);background:linear-gradient(180deg,#7797ed,#3458ac);border-radius:7px 7px 2px 2px;min-height:3px}.bar-label{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}.bar-val{font-size:10px;font-weight:750}.progress{height:8px;background:#edf0f6;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--primary2);border-radius:99px}.modal-backdrop{position:fixed;inset:0;background:#111b32a6;z-index:50;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:18px;width:min(100%,600px);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 80px #0003}.toast{position:fixed;right:20px;bottom:20px;background:#172338;color:white;padding:13px 17px;border-radius:12px;z-index:90;box-shadow:0 8px 30px #0002;max-width:min(90vw,400px)}.file-label{display:block;border:1px dashed #b9c7df;border-radius:12px;padding:18px;text-align:center;background:#fafcff;color:#5f6c83;font-size:13px;cursor:pointer}.file-label input{display:none}.schedule-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}.schedule-item:last-child{border:0}.time{font-size:12px;font-weight:800;color:var(--primary);min-width:88px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checkrow{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0}.checkrow input{width:auto}.mobile-menu{display:none}
@media(max-width:900px){.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.sidebar{display:none;border-right:0;border-bottom:1px solid var(--line)}.sidebar.open{display:block}.mobile-menu{display:inline-block}.main{padding:18px}.login-page{grid-template-columns:1fr}.hero{min-height:300px;padding:28px}.hero h1{font-size:34px}.hero-foot{margin-top:30px}.login-panel{padding:25px}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.wrap{padding:14px}.grid.two,.grid.three,.grid.four,.split{grid-template-columns:1fr}.topbar{padding:12px 14px}.top-actions .user-name{display:none}.main{padding:14px}.page-head{flex-direction:column}.card{padding:16px}.hero{min-height:260px}.hero h1{font-size:30px}.role-tab{font-size:11px}.stat{font-size:25px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const defaultState={
 settings:{name:'EduSmart LMS',school:'Platform Pembelajaran Terpadu',tagline:'Belajar terarah. Bertumbuh bersama.',heroText:'Satu ruang untuk belajar, mengajar, dan berkembang.',theme:'#284b9b',background:'',logo:'E'},
 users:[
  {id:'admin1',name:'Administrator Utama',username:'admin',password:'admin123',role:'admin',approved:true},
  {id:'teacher1',name:'Ibu Guru',username:'guru',password:'guru123',role:'teacher',approved:true,subject:'Akuntansi'},
  {id:'student1',name:'Alya Putri',username:'alya',password:'1234',role:'student',classId:'XI-A',pin:'1234'}
 ],
 classes:[
  {id:'X-A',name:'X Akuntansi',level:'X',year:'2026/2027',teacherId:'teacher1'},
  {id:'XI-A',name:'XI Akuntansi',level:'XI',year:'2026/2027',teacherId:'teacher1'},
  {id:'XII-A',name:'XII Akuntansi',level:'XII',year:'2026/2027',teacherId:'teacher1'}
 ],
 subjects:[
  {id:'x-sub1',name:'Dasar-Dasar Akuntansi dan Keuangan Lembaga',classId:'X-A',teacherId:'teacher1'},
  {id:'x-sub2',name:'Ekonomi Bisnis dan Administrasi Umum',classId:'X-A',teacherId:'teacher1'},
  {id:'x-sub3',name:'Aplikasi Komputer Akuntansi Dasar',classId:'X-A',teacherId:'teacher1'},
  {id:'xi-sub1',name:'Akuntansi Perusahaan Jasa, Dagang, dan Manufaktur',classId:'XI-A',teacherId:'teacher1'},
  {id:'xi-sub2',name:'Komputer Akuntansi',classId:'XI-A',teacherId:'teacher1'},
  {id:'xi-sub3',name:'Perpajakan',classId:'XI-A',teacherId:'teacher1'},
  {id:'xi-sub4',name:'Spreadsheet untuk Akuntansi',classId:'XI-A',teacherId:'teacher1'},
  {id:'xii-sub1',name:'Akuntansi Keuangan',classId:'XII-A',teacherId:'teacher1'},
  {id:'xii-sub2',name:'Akuntansi Manufaktur',classId:'XII-A',teacherId:'teacher1'},
  {id:'xii-sub3',name:'Komputer Akuntansi Lanjutan',classId:'XII-A',teacherId:'teacher1'},
  {id:'xii-sub4',name:'Perpajakan Lanjutan',classId:'XII-A',teacherId:'teacher1'},
  {id:'xii-sub5',name:'Praktikum Akuntansi dan Laporan Keuangan',classId:'XII-A',teacherId:'teacher1'}
 ],
 schedules:[{id:'sch1',classId:'XI-A',teacherId:'teacher1',subject:'Akuntansi Dasar',day:'Senin',start:'08:00',end:'09:30',room:'Ruang 2'}],
 materials:[{id:'mat1',title:'Pengenalan Siklus Akuntansi',subject:'Akuntansi Dasar',classId:'XI-A',description:'Materi pengantar siklus akuntansi dan tahapan pencatatan transaksi.',type:'Teks',content:'Siklus akuntansi merupakan rangkaian proses pencatatan transaksi hingga penyusunan laporan keuangan.',createdBy:'teacher1',date:today(),published:true}],
 assignments:[{id:'asg1',title:'Latihan Persamaan Dasar Akuntansi',classId:'XI-A',subject:'Akuntansi Dasar',description:'Kerjakan latihan persamaan dasar akuntansi.',due:today(),points:100,createdBy:'teacher1',type:'Tugas',published:true}],
 submissions:[],grades:[],announcements:[{id:'ann1',title:'Selamat datang di EduSmart LMS',body:'Silakan periksa materi, tugas, dan jadwal pembelajaran secara berkala.',date:today(),classId:'all'}],
 quizzes:[{id:'quiz1',title:'Kuis Akuntansi Dasar',classId:'XI-A',subject:'Akuntansi Dasar',questions:[{q:'Persamaan dasar akuntansi adalah ...',options:['Aset = Liabilitas + Ekuitas','Aset = Pendapatan - Beban','Kas = Modal - Utang'],answer:0,points:10},{q:'Bukti transaksi digunakan untuk ...',options:['Menghias laporan','Mendukung pencatatan transaksi','Menghapus saldo'],answer:1,points:10}],published:true}],
 attempts:[],activity:[],audit:[]
};
let state, current=null, activeRole='student', currentPage='dashboard', selectedClass='all', modalCleanup=null;
function load(){try{let raw=localStorage.getItem('edusmart_lms_v1');state=raw?JSON.parse(raw):structuredClone(defaultState);if(!state.settings)state=structuredClone(defaultState)}catch(e){state=structuredClone(defaultState)}}
function ensureAccountingClasses(){
 const classSeeds=[
  {id:'X-A',name:'X Akuntansi',level:'X',year:'2026/2027',teacherId:'teacher1'},
  {id:'XI-A',name:'XI Akuntansi',level:'XI',year:'2026/2027',teacherId:'teacher1'},
  {id:'XII-A',name:'XII Akuntansi',level:'XII',year:'2026/2027',teacherId:'teacher1'}
 ];
 state.classes=state.classes||[];
 classSeeds.forEach(c=>{if(!state.classes.some(x=>x.id===c.id))state.classes.push(c)});
 const courseSeeds=[
  ['x-sub1','Dasar-Dasar Akuntansi dan Keuangan Lembaga','X-A'],
  ['x-sub2','Ekonomi Bisnis dan Administrasi Umum','X-A'],
  ['x-sub3','Aplikasi Komputer Akuntansi Dasar','X-A'],
  ['xi-sub1','Akuntansi Perusahaan Jasa, Dagang, dan Manufaktur','XI-A'],
  ['xi-sub2','Komputer Akuntansi','XI-A'],
  ['xi-sub3','Perpajakan','XI-A'],
  ['xi-sub4','Spreadsheet untuk Akuntansi','XI-A'],
  ['xii-sub1','Akuntansi Keuangan','XII-A'],
  ['xii-sub2','Akuntansi Manufaktur','XII-A'],
  ['xii-sub3','Komputer Akuntansi Lanjutan','XII-A'],
  ['xii-sub4','Perpajakan Lanjutan','XII-A'],
  ['xii-sub5','Praktikum Akuntansi dan Laporan Keuangan','XII-A']
 ];
 state.subjects=state.subjects||[];
 courseSeeds.forEach(([sid,name,cid])=>{if(!state.subjects.some(x=>x.id===sid))state.subjects.push({id:sid,name,classId:cid,teacherId:'teacher1'})});
}
function save(){try{localStorage.setItem('edusmart_lms_v1',JSON.stringify(state));return true}catch(e){toast('Penyimpanan browser penuh. Coba gunakan file yang lebih kecil atau ekspor data.');return false}}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',3000)}
function logActivity(type,details){state.activity.unshift({id:id(),userId:current?.id||'system',type,details,date:new Date().toISOString()});state.activity=state.activity.slice(0,500);save()}
function audit(action,details){state.audit.unshift({id:id(),userId:current?.id||'system',action,details,date:new Date().toISOString()});state.audit=state.audit.slice(0,500)}
function userBy(idv){return state.users.find(u=>u.id===idv)}
function className(idv){return state.classes.find(c=>c.id===idv)?.name||idv||'—'}
function studentsIn(classId){return state.users.filter(u=>u.role==='student'&&(!classId||classId==='all'||u.classId===classId))}
function teacherClasses(){return state.classes.filter(c=>current?.role==='admin'||c.teacherId===current?.id)}
function myClasses(){return current?.role==='admin'?state.classes:current?.role==='teacher'?teacherClasses():state.classes.filter(c=>c.id===current?.classId)}
function myMaterials(){return state.materials.filter(m=>m.published&&(current?.role==='admin'||current?.role==='teacher'?(current.role==='admin'||m.createdBy===current.id||teacherClasses().some(c=>c.id===m.classId)):m.classId===current?.classId))}
function myAssignments(){return state.assignments.filter(a=>a.published&&(current?.role==='admin'||current?.role==='teacher'?(current.role==='admin'||a.createdBy===current.id||teacherClasses().some(c=>c.id===a.classId)):a.classId===current?.classId))}
function fmtDate(d){if(!d)return '—';try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function dateTime(d){try{return new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return d}}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`}
function btn(text,action,cls='secondary',attrs=''){return `<button class="${cls}" data-action="${action}" ${attrs}>${text}</button>`}
function field(label,name,value='',type='text',placeholder=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function selectField(label,name,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}
function card(title,body,extra=''){return `<section class="card section">${title?`<h2>${title}</h2>`:''}${body}${extra}</section>`}
function stats(items){return `<div class="grid four section">${items.map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat">${x[1]}</div><div class="muted" style="font-size:11px">${x[2]||''}</div></div>`).join('')}</div>`}
function renderLogin(){
 const s=state.settings;
 $('#app').innerHTML=`<div class="login-page"><section class="hero" id="hero" style="${s.background?`background-image:linear-gradient(120deg,#172c61d9,#3455a8a8),url('${s.background}')`:''}">
 <div class="brand"><div class="brand-mark">${esc(s.logo||'E')}</div><span>${esc(s.name)}</span></div>
 <div><span class="hero-badge">✦ ${esc(s.school)}</span><h1>${esc(s.tagline)}</h1><p>${esc(s.heroText)}</p><div class="row" style="gap:9px;flex-wrap:wrap"><span class="hero-badge">✓ Materi terpusat</span><span class="hero-badge">✓ Tugas & penilaian</span><span class="hero-badge">✓ Analisis pembelajaran</span></div></div>
 <div class="hero-foot">© ${new Date().getFullYear()} ${esc(s.name)} · Platform pembelajaran</div></section>
 <section class="login-panel"><div class="login-box"><div class="eyebrow">Selamat datang</div><h2 style="font-size:29px;margin:9px 0">Masuk ke ruang belajar</h2><p class="muted">Pilih jenis akun untuk melanjutkan ke LMS.</p>
 <div class="role-tabs"><button class="role-tab ${activeRole==='student'?'active':''}" data-action="role" data-role="student">🎓 Siswa</button><button class="role-tab ${activeRole==='teacher'?'active':''}" data-action="role" data-role="teacher">📘 Guru</button><button class="role-tab ${activeRole==='admin'?'active':''}" data-action="role" data-role="admin">⚙ Admin</button></div>
 <form id="loginForm">${activeRole==='student'?`${field('Nama siswa','name','','text','Masukkan nama sesuai daftar')}${selectField('Kelas','classId',[{value:'',label:'Pilih kelas'},...state.classes.map(c=>({value:c.id,label:c.name}))])}${field('PIN siswa (jika sudah diatur)','pin','','password','PIN pribadi')}`:`${field('Nama pengguna','username','','text','Masukkan nama pengguna')}${field('Password','password','','password','Masukkan password')}`}
 <button class="primary" style="width:100%;margin-top:5px" type="submit">Masuk ke LMS →</button></form>
 ${activeRole!=='student'?`<div class="login-links"><button class="ghost small" data-action="register" data-role="${activeRole}">Daftar sebagai ${activeRole==='teacher'?'guru':'administrasi'}</button><button class="ghost small" data-action="changePassword">Ubah sandi</button></div>`:`<p class="muted" style="font-size:12px;margin-top:12px">Siswa dapat mendaftar langsung menggunakan nama, kelas, dan PIN.</p><div class="login-links"><button class="ghost small" data-action="register" data-role="student">Daftar sebagai siswa</button><button class="ghost small" data-action="changePassword">Ubah PIN siswa</button></div>`}
 <div class="footer-note">Demo ini menyimpan data pada browser perangkat ini. Untuk penggunaan sekolah sungguhan, sambungkan backend, database terpusat, autentikasi aman, dan layanan AI. <br><br><b>Akun demo:</b> Admin <code>admin / admin123</code> · Guru <code>guru / guru123</code> · Siswa <code>Alya Putri / XI-A / 1234</code> · Kelas tersedia: X, XI, XII</div>
 </div></section></div>`;
 $('#loginForm').addEventListener('submit',login);
}
function login(e){e.preventDefault();const f=new FormData(e.target);
 if(activeRole==='student'){let name=(f.get('name')||'').trim().toLowerCase(),cid=f.get('classId'),pin=f.get('pin')||'';let u=state.users.find(x=>x.role==='student'&&x.name.toLowerCase()===name&&x.classId===cid);if(!u){toast('Nama dan kelas tidak cocok dengan data siswa.');return}if(u.pin&&u.pin!==pin){toast('PIN siswa tidak sesuai.');return}current=u}
 else{let un=(f.get('username')||'').trim().toLowerCase(),pw=f.get('password')||'';let u=state.users.find(x=>x.role===activeRole&&(x.username||'').toLowerCase()===un&&x.password===pw);if(!u){toast('Nama pengguna atau password salah.');return}current=u}
 currentPage='dashboard';logActivity('login','Masuk ke LMS');renderApp()}
function navItems(){if(current.role==='admin')return [['dashboard','▦','Dashboard'],['users','♙','Pengguna'],['classes','▤','Kelas & Mapel'],['schedule','▦','Jadwal'],['content','▧','Konten LMS'],['announcements','◉','Pengumuman'],['settings','⚙','Tampilan & Pengaturan'],['reports','▥','Laporan & Data'],['audit','◷','Audit Aktivitas']];
 if(current.role==='teacher')return [['dashboard','▦','Dashboard'],['materials','▧','Materi'],['assignments','☑','Tugas & Pengumpulan'],['quizzes','✓','Kuis & Koreksi'],['analysis','▥','Analisis Siswa'],['ai','✦','AI Teaching Assistant'],['schedule','▦','Jadwal'],['grades','▤','Nilai & Umpan Balik'],['announcements','◉','Pengumuman']];
 return [['dashboard','▦','Dashboard'],['materials','▧','Materi Pembelajaran'],['assignments','☑','Tugas Saya'],['quizzes','✓','Kuis'],['grades','▤','Nilai & Umpan Balik'],['schedule','▦','Jadwal'],['announcements','◉','Pengumuman'],['profile','♙','Profil Saya']]}
const pageTitles={dashboard:'Dashboard',users:'Manajemen Pengguna',classes:'Kelas & Mata Pelajaran',schedule:'Jadwal Pembelajaran',content:'Konten LMS',settings:'Tampilan & Pengaturan',reports:'Laporan & Data',audit:'Audit Aktivitas',materials:'Materi Pembelajaran',assignments:'Tugas & Pengumpulan',quizzes:'Kuis & Koreksi Otomatis',analysis:'Analisis Pembelajaran Siswa',ai:'AI Teaching Assistant',grades:'Nilai & Umpan Balik',announcements:'Pengumuman',profile:'Profil Saya'};
function renderApp(){if(!current){renderLogin();return}document.documentElement.style.setProperty('--primary',state.settings.theme||'#284b9b');let roleName={admin:'Administrasi',teacher:'Guru',student:'Siswa'}[current.role];
 $('#app').innerHTML=`<header class="topbar"><div class="row"><button class="ghost mobile-menu" data-action="mobileMenu">☰</button><div class="brand"><div class="brand-mark">${esc(state.settings.logo||'E')}</div><span>${esc(state.settings.name)}</span></div></div><div class="top-actions"><span class="pill">${roleName}</span><span class="user-name" style="font-size:13px;font-weight:700">${esc(current.name)}</span><button class="ghost small" data-action="logout">Keluar</button></div></header>
 <div class="layout"><aside class="sidebar" id="sidebar"><div class="side-label">Menu utama</div>${navItems().map(n=>`<button class="navbtn ${currentPage===n[0]?'active':''}" data-action="navigate" data-page="${n[0]}"><span class="navicon">${n[1]}</span>${n[2]}</button>`).join('')}<div class="side-label">Status sistem</div><div style="padding:8px 11px;font-size:11px;color:#68758b;line-height:1.6"><span class="pill good">● Demo lokal aktif</span><p style="margin:10px 0 0">Data tersimpan di browser ini.</p></div></aside><main class="main" id="main">${renderPage()}</main></div>`;
}
function pageHead(title,subtitle,action=''){return `<div class="page-head"><div><div class="eyebrow">${esc(current.role==='admin'?'Pusat administrasi':current.role==='teacher'?'Portal guru':'Ruang belajar siswa')}</div><h1 style="font-size:30px;margin:7px 0">${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function renderPage(){switch(currentPage){case'dashboard':return dashboard();case'users':return usersPage();case'classes':return classesPage();case'schedule':return schedulePage();case'content':return contentPage();case'settings':return settingsPage();case'reports':return reportsPage();case'audit':return auditPage();case'materials':return materialsPage();case'assignments':return assignmentsPage();case'quizzes':return quizzesPage();case'analysis':return analysisPage();case'ai':return aiPage();case'grades':return gradesPage();case'announcements':return announcementsPage();case'profile':return profilePage();default:return dashboard()}}
function dashboard(){
 if(current.role==='admin'){
 let pending=state.users.filter(u=>['teacher','admin'].includes(u.role)&&!u.approved).length;
 return pageHead('Selamat datang, '+esc(current.name.split(' ')[0]),'Ringkasan aktivitas dan pengelolaan LMS.')+stats([['Total siswa',studentsIn().length,'Terdaftar'],['Total guru',state.users.filter(u=>u.role==='teacher').length,'Semua status'],['Kelas aktif',state.classes.length,'Tahun ajaran berjalan'],['Menunggu persetujuan',pending,'Akun baru']])+`<div class="grid two">${card('Aktivitas terbaru',activityList())}${card('Akses cepat',`<div class="grid two">${btn('＋ Tambah pengguna','openUserModal','primary')}${btn('＋ Buat kelas','openClassModal','secondary')}${btn('▦ Atur jadwal','navigate','secondary','data-page="schedule"')}${btn('⚙ Pengaturan tampilan','navigate','secondary','data-page="settings"')}</div><div class="notice" style="margin-top:15px">Administrasi dapat mengelola akun, kelas, jadwal, tampilan awal, dan modul LMS.</div>`)}</div>`;
 }
 if(current.role==='teacher'){
 const mine=state.assignments.filter(a=>a.createdBy===current.id),pending=state.submissions.filter(s=>mine.some(a=>a.id===s.assignmentId)&&!s.grade).length;
 const st=studentsIn().filter(s=>teacherClasses().some(c=>c.id===s.classId));
 return pageHead('Selamat mengajar, '+esc(current.name.split(' ')[0]),'Berikut ringkasan kegiatan belajar yang perlu kamu pantau.')+stats([['Kelas diampu',teacherClasses().length,'Kelas'],['Siswa',st.length,'Pada kelas yang diampu'],['Materi',state.materials.filter(m=>m.createdBy===current.id).length,'Materi dibuat'],['Perlu dinilai',pending,'Pengumpulan tugas']])+`<div class="grid two">${card('Jadwal terdekat',scheduleList())}${card('Tugas perlu ditinjau',pendingSubmissions())}${card('Aktivitas kelas',activityList())}${card('Akses cepat',`<div class="grid two">${btn('＋ Tambah materi','openMaterialModal','primary')}${btn('＋ Buat tugas','openAssignmentModal','secondary')}${btn('✓ Koreksi kuis','navigate','secondary','data-page="quizzes"')}${btn('✦ Tanya AI','navigate','secondary','data-page="ai"')}</div>`)}</div>`;
 }
 let myA=myAssignments(),mineM=myMaterials(),mySub=state.submissions.filter(s=>s.studentId===current.id);
 return pageHead('Halo, '+esc(current.name.split(' ')[0])+' 👋','Siap belajar hari ini? Ini ringkasan ruang belajarmu.')+stats([['Materi tersedia',mineM.length,'Bisa dipelajari'],['Tugas aktif',myA.length,'Dari kelasmu'],['Sudah dikumpulkan',mySub.length,'Riwayat tugas'],['Kuis tersedia',state.quizzes.filter(q=>q.published&&q.classId===current.classId).length,'Latihan']])+`<div class="grid two">${card('Jadwal pembelajaran',scheduleList())}${card('Tugas yang perlu dikerjakan',studentPendingTasks())}${card('Materi terbaru',materialList(mineM.slice(0,3),false))}${card('Pengumuman',announcementList())}</div>`;
}
function activityList(){let items=state.activity.slice(0,5);return items.length?items.map(a=>`<div class="schedule-item"><div class="time">${dateTime(a.date)}</div><div><b style="font-size:13px">${esc(userBy(a.userId)?.name||'Sistem')}</b><div class="muted" style="font-size:12px">${esc(a.details)}</div></div></div>`).join(''):empty('Belum ada aktivitas tercatat.')}
function scheduleList(){let dayMap={Minggu:0,Senin:1,Selasa:2,Rabu:3,Kamis:4,Jumat:5,Sabtu:6};let rows=state.schedules.filter(s=>current.role==='admin'||(current.role==='teacher'?s.teacherId===current.id:s.classId===current.classId)).sort((a,b)=>(dayMap[a.day]??7)-(dayMap[b.day]??7)||a.start.localeCompare(b.start)).slice(0,5);return rows.length?rows.map(s=>`<div class="schedule-item"><div class="time">${esc(s.day)}<br>${esc(s.start)}–${esc(s.end)}</div><div><b style="font-size:13px">${esc(s.subject)}</b><div class="muted" style="font-size:12px">${esc(className(s.classId))} · ${esc(s.room||'Ruang belum ditentukan')}</div></div></div>`).join(''):empty('Belum ada jadwal yang diatur.')}
function pendingSubmissions(){let rows=state.submissions.filter(s=>{let a=state.assignments.find(a=>a.id===s.assignmentId);return a&&(current.role==='admin'||a.createdBy===current.id)&&s.grade==null}).slice(0,5);return rows.length?rows.map(s=>`<div class="schedule-item"><div class="time">${fmtDate(s.date)}</div><div><b style="font-size:13px">${esc(userBy(s.studentId)?.name||'Siswa')}</b><div class="muted" style="font-size:12px">${esc(state.assignments.find(a=>a.id===s.assignmentId)?.title||'Tugas')}</div><button class="secondary small" data-action="gradeSubmission" data-id="${s.id}">Periksa</button></div></div>`).join(''):empty('Tidak ada pengumpulan yang menunggu penilaian.')}
function studentPendingTasks(){let rows=myAssignments().filter(a=>!state.submissions.some(s=>s.assignmentId===a.id&&s.studentId===current.id));return rows.length?rows.slice(0,5).map(a=>`<div class="schedule-item"><div class="time">${fmtDate(a.due)}</div><div><b style="font-size:13px">${esc(a.title)}</b><div class="muted" style="font-size:12px">${esc(a.subject)}</div><button class="secondary small" data-action="submitTask" data-id="${a.id}">Kerjakan</button></div></div>`).join(''):empty('Hebat! Tidak ada tugas yang belum dikumpulkan.')}
function usersPage(){let roleFilter=window.userFilter||'all';let list=state.users.filter(u=>roleFilter==='all'||u.role===roleFilter);return pageHead('Manajemen pengguna','Kelola akun, persetujuan, dan akses setiap pengguna.',btn('＋ Tambah pengguna','openUserModal','primary'))+`<section class="card"><div class="row between" style="margin-bottom:15px;flex-wrap:wrap"><div class="row" style="flex-wrap:wrap"><select id="userFilter" style="width:auto"><option value="all">Semua peran</option><option value="teacher">Guru</option><option value="student">Siswa</option><option value="admin">Administrasi</option></select><input id="userSearch" placeholder="Cari nama atau username..." style="width:min(280px,100%)"></div><label class="ghost small" style="border-radius:10px;padding:8px 10px;cursor:pointer">Impor CSV <input id="importUsers" type="file" accept=".csv,text/csv" style="display:none"></label></div><div id="usersTable">${usersTable(list)}</div></section><div class="notice" style="margin-top:14px">Akun baru guru/administrasi menunggu persetujuan. Impor CSV mendukung kolom: name, username, role, classId, subject.</div>`}
function usersTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Kelas/Mapel</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username||'—')}</td><td>${esc({admin:'Administrasi',teacher:'Guru',student:'Siswa'}[u.role])}</td><td>${esc(u.role==='student'?className(u.classId):u.subject||'—')}</td><td><span class="pill ${u.approved?'good':'warn'}">${u.approved?'Aktif':'Menunggu'}</span></td><td><div class="actions">${!u.approved?btn('Setujui','approveUser','secondary small',`data-id="${u.id}"`):''}${btn('Edit','editUser','ghost small',`data-id="${u.id}"`)}${u.id!=='admin1'?btn('Nonaktifkan','deactivateUser','danger small',`data-id="${u.id}"`):''}</div></td></tr>`).join('')}</tbody></table></div>`:empty('Tidak ada pengguna yang sesuai.')}
function classesPage(){return pageHead('Kelas & mata pelajaran','Atur kelas, tahun ajaran, siswa, dan guru pengampu.',btn('＋ Buat kelas','openClassModal','primary'))+`<div class="grid two">${card('Daftar kelas',state.classes.length?`<div class="table-wrap"><table><thead><tr><th>Kelas</th><th>Tahun ajaran</th><th>Guru</th><th>Siswa</th><th>Aksi</th></tr></thead><tbody>${state.classes.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.level||'')}</div></td><td>${esc(c.year||'—')}</td><td>${esc(userBy(c.teacherId)?.name||'Belum ditentukan')}</td><td>${studentsIn(c.id).length}</td><td><div class="actions">${btn('Edit','editClass','ghost small',`data-id="${c.id}"`)}${btn('Siswa','classStudents','secondary small',`data-id="${c.id}"`)}</div></td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada kelas.'))}${card('Mata pelajaran',`<form id="subjectForm">${field('Nama mata pelajaran','name','','text','Contoh: Akuntansi Dasar')}${selectField('Kelas','classId',state.classes.map(c=>({value:c.id,label:c.name})))}${selectField('Guru pengampu','teacherId',state.users.filter(u=>u.role==='teacher'&&u.approved).map(u=>({value:u.id,label:u.name})))}<button class="primary">Tambah mata pelajaran</button></form><div style="margin-top:14px">${state.subjects.length?state.subjects.map(s=>`<div class="schedule-item"><div class="brand-mark" style="width:32px;height:32px;font-size:13px">M</div><div style="flex:1"><b>${esc(s.name)}</b><div class="muted" style="font-size:12px">${esc(className(s.classId))} · ${esc(userBy(s.teacherId)?.name||'—')}</div></div>${btn('×','deleteSubject','danger small',`data-id="${s.id}"`)}</div>`).join(''):empty('Belum ada mata pelajaran.')}</div>`)}</div>`}
function schedulePage(){return pageHead('Jadwal pembelajaran','Atur jadwal pelajaran dan tampilkan jadwal yang sesuai untuk setiap kelas.',current.role==='admin'?btn('＋ Tambah jadwal','openScheduleModal','primary'):'')+`<section class="card"><div class="row between" style="margin-bottom:12px;flex-wrap:wrap"><h2 style="margin:0">Jadwal mingguan</h2>${current.role==='admin'?'<span class="pill">Dikelola administrasi</span>':''}</div>${state.schedules.filter(s=>current.role==='admin'||(current.role==='teacher'?s.teacherId===current.id:s.classId===current.classId)).length?`<div class="table-wrap"><table><thead><tr><th>Hari</th><th>Waktu</th><th>Mata pelajaran</th><th>Kelas</th><th>Guru</th><th>Ruang</th>${current.role==='admin'?'<th>Aksi</th>':''}</tr></thead><tbody>${state.schedules.filter(s=>current.role==='admin'||(current.role==='teacher'?s.teacherId===current.id:s.classId===current.classId)).map(s=>`<tr><td>${esc(s.day)}</td><td>${esc(s.start)}–${esc(s.end)}</td><td>${esc(s.subject)}</td><td>${esc(className(s.classId))}</td><td>${esc(userBy(s.teacherId)?.name||'—')}</td><td>${esc(s.room||'—')}</td>${current.role==='admin'?`<td><div class="actions">${btn('Edit','editSchedule','ghost small',`data-id="${s.id}"`)}${btn('Hapus','deleteSchedule','danger small',`data-id="${s.id}"`)}</div></td>`:''}</tr>`).join('')}</tbody></table></div>`:empty('Belum ada jadwal untuk akun ini.')}</section><div class="notice">Pemeriksaan bentrok jadwal dasar dapat dikembangkan lebih lanjut apabila sekolah menggunakan data ruang dan kalender akademik lengkap.</div>`}
function contentPage(){return pageHead('Konten LMS','Ringkasan materi, tugas, kuis, dan pengumuman yang tersedia.',`<div class="actions">${btn('＋ Materi','openMaterialModal','primary')}${btn('＋ Tugas','openAssignmentModal','secondary')}</div>`)+`<div class="grid three">${stats([['Materi',state.materials.length,'Semua materi'],['Tugas',state.assignments.length,'Semua tugas'],['Kuis',state.quizzes.length,'Semua kuis']]).replace('grid four','grid three')}</div>${card('Materi terbaru',materialList(state.materials.slice().reverse().slice(0,6),true))}${card('Tugas terbaru',assignmentTable(state.assignments.slice().reverse().slice(0,6),true))}`}
function settingsPage(){let s=state.settings;return pageHead('Tampilan & pengaturan','Sesuaikan identitas dan background halaman awal LMS.')+`<div class="grid two"><section class="card"><h2>Identitas LMS</h2><form id="settingsForm">${field('Nama LMS','name',s.name)}${field('Nama sekolah/lembaga','school',s.school)}${field('Tagline','tagline',s.tagline)}<div class="field"><label>Deskripsi halaman awal</label><textarea name="heroText">${esc(s.heroText)}</textarea></div>${field('Inisial logo','logo',s.logo||'E')}${field('Warna utama (hex)','theme',s.theme||'#284b9b','text','#284b9b')}<button class="primary">Simpan pengaturan</button></form></section><section class="card"><h2>Background halaman awal</h2><p class="muted" style="font-size:13px">Unggah foto JPG, PNG, atau WebP. Untuk demo ini gambar disimpan pada browser perangkat.</p><label class="file-label">📷 Pilih foto background<input id="backgroundUpload" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="backgroundPreview" style="margin-top:14px">${s.background?`<img src="${s.background}" alt="Pratinjau background" style="width:100%;height:180px;object-fit:cover;border-radius:13px">`:empty('Belum ada foto background. Menggunakan background bawaan.')}</div><div class="actions" style="margin-top:12px">${btn('Hapus background','clearBackground','danger')}${btn('Lihat halaman login','previewLogin','secondary')}</div><div class="notice warn" style="margin-top:14px">Foto berukuran besar dapat memenuhi penyimpanan browser. Versi produksi sebaiknya menyimpan gambar di penyimpanan server.</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Pengaturan data demo</h3><div class="actions">${btn('Ekspor backup JSON','exportData','secondary')}${btn('Impor backup JSON','importBackup','ghost')}<input id="backupFile" type="file" accept=".json,application/json" class="hidden"></div></section></div><section class="card"><h2>Modul navigasi</h2><p class="muted" style="font-size:13px">Administrasi dapat mengatur modul mana yang tampil di menu setiap peran. Modul inti seperti login dan keamanan tetap dilindungi.</p>${[['materials','Materi pembelajaran'],['assignments','Tugas'],['quizzes','Kuis & koreksi'],['analysis','Analisis siswa'],['ai','AI Teaching Assistant'],['grades','Nilai & umpan balik'],['schedule','Jadwal'],['announcements','Pengumuman']].map(([key,label])=>`<label class="checkrow"><input type="checkbox" data-module="${key}" ${state.settings.modules?.[key]!==false?'checked':''}> ${label}</label>`).join('')}<button class="primary" data-action="saveModules">Simpan modul</button></section>`}
function reportsPage(){let n=studentsIn().length,submitted=state.submissions.length,graded=state.submissions.filter(s=>s.grade!=null).length;return pageHead('Laporan & data','Ringkasan data akademik. Ekspor data sesuai kebutuhan.')+stats([['Siswa',n,'Semua kelas'],['Pengumpulan',submitted,'Total jawaban tugas'],['Sudah dinilai',graded,'Pengumpulan'],['Materi',state.materials.length,'Total materi']])+`<div class="grid two">${card('Ekspor laporan',`<p class="muted">Unduh data demo dalam format CSV atau JSON untuk analisis lanjutan.</p><div class="actions">${btn('Ekspor pengguna CSV','exportUsersCSV','primary')}${btn('Ekspor nilai CSV','exportGradesCSV','secondary')}${btn('Ekspor semua data JSON','exportData','ghost')}</div>`)}${card('Status sistem',`<div class="schedule-item"><div class="time">Penyimpanan</div><div><b>Browser lokal</b><div class="muted" style="font-size:12px">Data hanya tersedia di perangkat dan browser ini.</div></div></div><div class="schedule-item"><div class="time">AI eksternal</div><div><b>Belum terhubung</b><div class="muted" style="font-size:12px">Butuh backend dan API key yang aman.</div></div></div><div class="schedule-item"><div class="time">Akses</div><div><b>Demo frontend</b><div class="muted" style="font-size:12px">Jangan gunakan data siswa asli atau sensitif.</div></div></div>`)}</div>`}
function auditPage(){return pageHead('Audit aktivitas','Riwayat perubahan dan aktivitas yang tercatat.')+card('Log audit',state.audit.length?`<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>${state.audit.slice(0,100).map(a=>`<tr><td>${dateTime(a.date)}</td><td>${esc(userBy(a.userId)?.name||'Sistem')}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada perubahan yang tercatat.'))}
function materialList(list,admin=false){return list.length?list.map(m=>`<div class="schedule-item"><div class="brand-mark" style="width:38px;height:38px;font-size:15px">▧</div><div style="flex:1;min-width:0"><b>${esc(m.title)}</b><div class="muted" style="font-size:12px">${esc(m.subject)} · ${esc(className(m.classId))} · ${fmtDate(m.date)}</div><div style="font-size:13px;margin-top:5px">${esc(m.description||'')}</div><div class="actions" style="margin-top:8px">${btn('Buka materi','viewMaterial','secondary small',`data-id="${m.id}"`)}${(current.role==='admin'||m.createdBy===current.id)&&current.role!=='student'?btn('Edit','editMaterial','ghost small',`data-id="${m.id}"`):''}${(current.role==='admin'||m.createdBy===current.id)&&current.role!=='student'?btn('Hapus','deleteMaterial','danger small',`data-id="${m.id}"`):''}</div></div><span class="pill ${m.published?'good':'warn'}">${m.published?'Terbit':'Draf'}</span></div>`).join(''):empty('Belum ada materi yang tersedia.')}
function materialsPage(){let list=current.role==='student'?myMaterials():state.materials.filter(m=>current.role==='admin'||m.createdBy===current.id||teacherClasses().some(c=>c.id===m.classId));return pageHead('Materi pembelajaran','Materi tersusun berdasarkan mata pelajaran dan kelas.',current.role==='teacher'?btn('＋ Tambah materi','openMaterialModal','primary'):'')+`<section class="card">${current.role==='teacher'?`<div class="notice" style="margin-bottom:14px">Unggah file, tautan, atau buat materi teks. Untuk QR code, gunakan tautan materi yang dapat dipindai dengan kamera.</div>`:''}${materialList(list,true)}</section>`}
function assignmentsPage(){if(current.role==='student'){let list=myAssignments();return pageHead('Tugas saya','Periksa tenggat waktu dan status pengumpulan.')+`<section class="card">${list.length?list.map(a=>{let sub=state.submissions.find(s=>s.assignmentId===a.id&&s.studentId===current.id);return `<div class="schedule-item"><div class="brand-mark" style="width:38px;height:38px">☑</div><div style="flex:1"><b>${esc(a.title)}</b><div class="muted" style="font-size:12px">${esc(a.subject)} · Tenggat ${fmtDate(a.due)}</div><p style="font-size:13px;margin:6px 0">${esc(a.description)}</p>${sub?`<span class="pill ${sub.grade!=null?'good':'warn'}">${sub.grade!=null?'Dinilai: '+sub.grade:'Sudah dikumpulkan'}</span> ${sub.feedback?`<div class="muted" style="font-size:12px;margin-top:6px">Umpan balik: ${esc(sub.feedback)}</div>`:''}`:`<span class="pill warn">Belum dikumpulkan</span>`}</div><div>${sub?btn('Lihat jawaban','viewSubmission','ghost small',`data-id="${sub.id}"`):btn('Kumpulkan','submitTask','primary small',`data-id="${a.id}"`)}</div></div>`}).join(''):empty('Belum ada tugas yang diterbitkan untuk kelasmu.')}</section>`}
let list=state.assignments.filter(a=>current.role==='admin'||a.createdBy===current.id);return pageHead('Tugas & pengumpulan','Buat tugas dan periksa pekerjaan siswa.',current.role==='teacher'?btn('＋ Buat tugas','openAssignmentModal','primary'):'')+`<section class="card">${assignmentTable(list,true)}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Pengumpulan siswa</h2>${pendingSubmissions()}</section>`}

function analysisPage(){let classOpts=[{value:'all',label:'Semua kelas'},...teacherClasses().map(c=>({value:c.id,label:c.name}))];let cId=window.analysisClass||'all',sts=studentsIn(cId).filter(s=>current.role==='admin'||teacherClasses().some(c=>c.id===s.classId));let rows=sts.map(s=>{let subs=state.submissions.filter(x=>x.studentId===s.id),graded=subs.filter(x=>x.grade!=null),avg=graded.length?Math.round(graded.reduce((n,x)=>n+Number(x.grade),0)/graded.length):null;let total=state.assignments.filter(a=>a.classId===s.classId&&a.published).length,submitted=state.submissions.filter(x=>x.studentId===s.id&&state.assignments.some(a=>a.id===x.assignmentId&&a.classId===s.classId)).length;return {...s,avg,total,submitted,late:subs.filter(x=>{let a=state.assignments.find(a=>a.id===x.assignmentId);return a&&x.date>a.due+'T23:59:59'}).length,completion:total?Math.min(100,Math.round(submitted/total*100)):0}});let avgClass=rows.filter(x=>x.avg!=null);avgClass=avgClass.length?Math.round(avgClass.reduce((n,x)=>n+x.avg,0)/avgClass.length):0;
return pageHead('Analisis pembelajaran siswa','Gunakan bukti pembelajaran untuk merencanakan dukungan yang tepat.')+`<section class="card"><div class="row between" style="flex-wrap:wrap"><h2>Ringkasan kelas</h2><select id="analysisClass" style="width:auto">${classOpts.map(o=>`<option value="${esc(o.value)}" ${o.value===cId?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>${stats([['Siswa dianalisis',rows.length,'Sesuai filter'],['Rata-rata nilai tercatat',avgClass+'%', 'Dari tugas yang sudah dinilai'],['Rata-rata pengumpulan',rows.length?Math.round(rows.reduce((n,x)=>n+x.completion,0)/rows.length)+'%':'0%','Tugas terkumpul dibanding tugas aktif'],['Belum ada nilai',rows.filter(x=>x.avg==null).length,'Perlu data penilaian']])}<div class="grid two"><div><h3>Rata-rata nilai siswa</h3>${barChart(rows.slice(0,8).map(x=>({label:x.name.split(' ')[0],value:x.avg||0})))}</div><div><h3>Penyelesaian tugas</h3>${barChart(rows.slice(0,8).map(x=>({label:x.name.split(' ')[0],value:x.completion})))}</div></div></section><section class="card"><h2>Evaluasi individual</h2>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Siswa</th><th>Rata-rata nilai</th><th>Pengumpulan</th><th>Terlambat</th><th>Catatan berbasis data</th><th>Aksi</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(className(s.classId))}</div></td><td>${s.avg==null?'Belum ada':s.avg+'/100'}</td><td>${s.completion}%</td><td>${s.late}</td><td>${s.avg==null?'Data nilai belum cukup':s.avg<70?'Perlu pemeriksaan pemahaman materi':s.completion<70?'Perlu dukungan pengelolaan tenggat':'Perkembangan data tercatat cukup baik'}</td><td>${btn('Detail & AI','studentAnalysis','secondary small',`data-id="${s.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada data siswa untuk dianalisis.')}</section><div class="notice warn">Analisis hanya mencerminkan data yang tercatat dalam LMS, bukan diagnosis karakter atau kepribadian. Guru perlu memeriksa konteks sebelum mengambil keputusan.</div>`}

function openUserModal(user=null){let roleOpts=[{value:'teacher',label:'Guru'},{value:'student',label:'Siswa'},{value:'admin',label:'Administrasi'}];let isEdit=!!user;showModal(isEdit?'Edit pengguna':'Tambah pengguna',`${field('Nama lengkap','name',user?.name||'')}${field('Username','username',user?.username||'')}${field(isEdit?'Password baru (opsional)':'Password','password','','password',isEdit?'Kosongkan jika tidak diubah':'Buat password')}${selectField('Peran','role',roleOpts,user?.role||'student')}${selectField('Kelas (untuk siswa)','classId',[{value:'',label:'— Tidak ada —'},...state.classes.map(c=>({value:c.id,label:c.name}))],user?.classId||'')}${field('Mata pelajaran (untuk guru)','subject',user?.subject||'')}${field('PIN siswa (opsional)','pin',user?.pin||'','text')}`,isEdit?'Simpan perubahan':'Buat pengguna',f=>{let role=f.get('role');let name=f.get('name').trim(),username=f.get('username').trim();if(!name){toast('Nama wajib diisi.');return}if(username&&state.users.some(u=>u.username?.toLowerCase()===username.toLowerCase()&&u.id!==user?.id)){toast('Username sudah digunakan.');return}if(!isEdit&&!f.get('password')){toast('Password wajib diisi untuk akun ini.');return}if(user){user.name=name;user.username=username;if(f.get('password'))user.password=f.get('password');user.role=role;user.classId=f.get('classId')||'';user.subject=f.get('subject')||'';user.pin=f.get('pin')||user.pin; if(role==='student')user.approved=true}else{state.users.push({id:id(),name,username,password:f.get('password'),role,classId:f.get('classId')||'',subject:f.get('subject')||'',pin:f.get('pin')||'',approved:role==='student'?true:false})}audit(isEdit?'Edit pengguna':'Tambah pengguna',name+' ('+role+')');save();closeModal();renderApp();toast(isEdit?'Pengguna diperbarui.':'Pengguna ditambahkan.')})}
function openClassModal(cls=null){showModal(cls?'Edit kelas':'Buat kelas',`${field('Nama kelas','name',cls?.name||'')}${field('Tingkat','level',cls?.level||'')}${field('Tahun ajaran','year',cls?.year||'2026/2027')}${selectField('Wali/pengampu','teacherId',[{value:'',label:'Belum ditentukan'},...state.users.filter(u=>u.role==='teacher'&&u.approved).map(u=>({value:u.id,label:u.name}))],cls?.teacherId||'')}`,cls?'Simpan':'Buat kelas',f=>{if(!f.get('name').trim()){toast('Nama kelas wajib diisi.');return}if(cls)Object.assign(cls,{name:f.get('name').trim(),level:f.get('level'),year:f.get('year'),teacherId:f.get('teacherId')});else state.classes.push({id:id(),name:f.get('name').trim(),level:f.get('level'),year:f.get('year'),teacherId:f.get('teacherId')});audit(cls?'Edit kelas':'Buat kelas',f.get('name'));save();closeModal();renderApp();toast('Data kelas disimpan.')})}
function openScheduleModal(s=null){let days=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];showModal(s?'Edit jadwal':'Tambah jadwal',`${selectField('Kelas','classId',state.classes.map(c=>({value:c.id,label:c.name})),s?.classId||'')}${selectField('Guru','teacherId',state.users.filter(u=>u.role==='teacher'&&u.approved).map(u=>({value:u.id,label:u.name})),s?.teacherId||'')}${field('Mata pelajaran','subject',s?.subject||'')}${selectField('Hari','day',days.map(d=>({value:d,label:d})),s?.day||'Senin')}<div class="grid two">${field('Mulai','start',s?.start||'08:00','time')}${field('Selesai','end',s?.end||'09:30','time')}</div>${field('Ruang','room',s?.room||'')}`,s?'Simpan':'Tambah jadwal',f=>{if(f.get('end')<=f.get('start')){toast('Waktu selesai harus setelah waktu mulai.');return}let obj={classId:f.get('classId'),teacherId:f.get('teacherId'),subject:f.get('subject'),day:f.get('day'),start:f.get('start'),end:f.get('end'),room:f.get('room')};let conflict=state.schedules.find(x=>x.id!==s?.id&&x.day===obj.day&&x.start<obj.end&&x.end>obj.start&&(x.teacherId===obj.teacherId||x.classId===obj.classId));if(conflict){toast('Peringatan: jadwal bertabrakan untuk guru atau kelas.');return}if(s)Object.assign(s,obj);else state.schedules.push({id:id(),...obj});audit(s?'Edit jadwal':'Tambah jadwal',obj.subject+' '+obj.day);save();closeModal();renderApp();toast('Jadwal disimpan.')})}
function openMaterialModal(m=null){showModal(m?'Edit materi':'Tambah materi',`${field('Judul materi','title',m?.title||'')}${field('Mata pelajaran','subject',m?.subject||'')}${selectField('Kelas tujuan','classId',state.classes.map(c=>({value:c.id,label:c.name})),m?.classId||'')}${selectField('Jenis materi','type',['Teks','PDF','Word','PowerPoint','Excel','Video','Tautan','QR / tautan QR'].map(x=>({value:x,label:x})),m?.type||'Teks')}<div class="field"><label>Deskripsi</label><textarea name="description">${esc(m?.description||'')}</textarea></div><div class="field"><label>Isi materi atau tautan</label><textarea name="content" placeholder="Tulis isi materi atau tempel URL yang dapat diakses...">${esc(m?.content||'')}</textarea></div><div class="field"><label>Unggah file (opsional)</label><input type="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.png,.jpg,.jpeg,.webp,.mp4"></div><label class="checkrow"><input type="checkbox" name="published" ${m?.published!==false?'checked':''}> Terbitkan materi</label>`,m?'Simpan':'Simpan materi',async f=>{let file=f.get('file'),content=f.get('content').trim();if(!f.get('title').trim()){toast('Judul materi wajib diisi.');return}if(file&&file.size>1_500_000){toast('File demo dibatasi 1,5 MB. Untuk file besar gunakan backend penyimpanan.');return}let fileData=null;if(file&&file.size){fileData=await readFile(file).catch(()=>null);if(!fileData){toast('File gagal dibaca.');return}}let obj={title:f.get('title').trim(),subject:f.get('subject'),classId:f.get('classId'),type:f.get('type'),description:f.get('description'),content,createdBy:m?.createdBy||current.id,date:today(),published:f.has('published'),fileName:file?.name||m?.fileName||'',fileData:fileData||m?.fileData||''};if(m)Object.assign(m,obj);else state.materials.push({id:id(),...obj});logActivity('materi',obj.title);audit(m?'Edit materi':'Tambah materi',obj.title);save();closeModal();renderApp();toast('Materi disimpan.')})}

function openQuizModal(q=null){let cls=teacherClasses();showModal(q?'Edit kuis':'Buat kuis',`${field('Judul kuis','title',q?.title||'')}${field('Mata pelajaran','subject',q?.subject||'')}${selectField('Kelas tujuan','classId',cls.map(c=>({value:c.id,label:c.name})),q?.classId||'')}${field('Jumlah soal','count',q?.questions?.length||3,'number')}<div class="notice">Setelah dibuat, isi atau edit soal, pilihan, dan kunci jawaban satu per satu. Jawaban benar tidak ditampilkan kepada siswa sebelum kuis dikumpulkan.</div>`,q?'Simpan':'Buat kuis',f=>{let count=Math.max(1,Math.min(50,Number(f.get('count'))||3));if(q){q.title=f.get('title');q.subject=f.get('subject');q.classId=f.get('classId');}else{q={id:id(),title:f.get('title'),subject:f.get('subject'),classId:f.get('classId'),createdBy:current.id,published:false,questions:Array.from({length:count},(_,i)=>({q:'Soal '+(i+1),options:['Pilihan A','Pilihan B','Pilihan C','Pilihan D'],answer:0,points:10}))};state.quizzes.push(q)}save();closeModal();editQuiz(q.id)})}
function editQuiz(qid){let q=state.quizzes.find(x=>x.id===qid);if(!q)return;let body=`${field('Judul kuis','title',q.title)}<label class="checkrow"><input type="checkbox" name="published" ${q.published?'checked':''}> Terbitkan kuis untuk siswa</label>`+q.questions.map((question,i)=>`<div style="padding:13px 0;border-top:1px solid var(--line)"><h3>Soal ${i+1}</h3><div class="field"><label>Pertanyaan</label><textarea name="q_${i}" required>${esc(question.q)}</textarea></div>${question.options.map((o,j)=>`<div class="field"><label>Pilihan ${String.fromCharCode(65+j)}</label><input name="opt_${i}_${j}" value="${esc(o)}" required></div>`).join('')}${selectField('Kunci jawaban soal '+(i+1),'ans_'+i,question.options.map((o,j)=>({value:j,label:String.fromCharCode(65+j)+' — '+o})),question.answer)}${field('Poin','pts_'+i,question.points||10,'number')}</div>`).join('')+`<button type="button" class="ghost" data-action="addQuestion" data-id="${q.id}">＋ Tambah soal</button>`;showModal('Edit soal dan kunci',body,'Simpan kunci',f=>{q.title=f.get('title');q.published=f.has('published');q.questions.forEach((question,i)=>{question.q=f.get('q_'+i);question.options=question.options.map((o,j)=>f.get('opt_'+i+'_'+j));question.answer=Number(f.get('ans_'+i));question.points=Number(f.get('pts_'+i))||10});audit('Edit kunci kuis',q.title);save();closeModal();renderApp();toast('Kuis dan kunci tersimpan.')})}
function openKeyModal(qid=null){let q=state.quizzes.find(x=>x.id===qid);showModal('Koreksi / impor kunci jawaban',`${selectField('Pilih kuis (opsional)','quizId',[{value:'',label:'Kunci eksternal / belum memilih kuis'},...state.quizzes.filter(x=>current.role==='admin'||teacherClasses().some(c=>c.id===x.classId)).map(x=>({value:x.id,label:x.title}))],q?.id||'')}<div class="field"><label>Kunci jawaban teks</label><textarea name="keyText" placeholder="Contoh:&#10;1,A,10&#10;2,C,10&#10;3,B,5"></textarea></div><div class="field"><label>Unggah CSV (opsional)</label><input name="keyFile" type="file" accept=".csv,text/csv"></div><div class="field"><label>URL file (opsional)</label><input name="keyUrl" type="url" placeholder="https://..."></div><div class="notice warn">Demo dapat membaca CSV atau teks yang dimasukkan. URL eksternal, PDF, Word, dan hasil pindai belum diproses otomatis tanpa backend/OCR. Selalu periksa kunci sebelum menerbitkan nilai.</div>`,'Baca kunci',async f=>{let raw=f.get('keyText')||'',file=f.get('keyFile');if(file&&file.size){raw=await file.text()}if(!raw.trim()&&f.get('keyUrl')){toast('Pembacaan URL eksternal memerlukan backend dengan validasi keamanan.');return}let lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),parsed=[];for(let line of lines){let parts=line.split(/[,\t;]/).map(x=>x.trim());if(parts.length>=2){let n=Number(parts[0]),ans=parts[1].toUpperCase().replace(/[^A-D]/g,'').charAt(0);if(n>0&&ans)parsed.push({number:n,answer:ans,points:Number(parts[2])||1})}}if(!parsed.length){toast('Kunci tidak terbaca. Gunakan format nomor,jawaban,poin.');return}if(f.get('quizId')){let quiz=state.quizzes.find(x=>x.id===f.get('quizId'));parsed.forEach(p=>{if(quiz.questions[p.number-1]){quiz.questions[p.number-1].answer='ABCD'.indexOf(p.answer);quiz.questions[p.number-1].points=p.points}});save()}closeModal();showModal('Konfirmasi hasil pembacaan',`<div class="notice">Ditemukan ${parsed.length} kunci. Periksa data berikut sebelum digunakan.</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>No.</th><th>Jawaban</th><th>Poin</th></tr></thead><tbody>${parsed.map(p=>`<tr><td>${p.number}</td><td>${p.answer}</td><td>${p.points}</td></tr>`).join('')}</tbody></table></div>`, 'Selesai',()=>{closeModal();renderApp();toast('Kunci sudah diproses. Pastikan hasilnya benar.')})})}
function takeQuiz(qid){let q=state.quizzes.find(x=>x.id===qid);if(!q)return;let existing=state.attempts.find(a=>a.quizId===qid&&a.studentId===current.id);if(existing){toast('Kuis ini sudah dikerjakan.');return}showModal(q.title,`<div class="notice warn">Setelah dikumpulkan, jawaban akan dinilai otomatis. Periksa kembali sebelum mengirim.</div>`+q.questions.map((question,i)=>`<div style="padding:15px 0;border-bottom:1px solid var(--line)"><b>${i+1}. ${esc(question.q)}</b>${question.options.map((o,j)=>`<label class="checkrow"><input type="radio" name="q_${i}" value="${j}" ${j===0?'':''}> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div>`).join(''),'Kumpulkan jawaban',f=>{let score=0,max=0,answers=[];q.questions.forEach((question,i)=>{let a=f.get('q_'+i);answers.push(a==null?null:Number(a));max+=Number(question.points)||10;if(a!=null&&Number(a)===Number(question.answer))score+=Number(question.points)||10});let attempt={id:id(),quizId:qid,studentId:current.id,answers,score,maxScore:max,date:new Date().toISOString()};state.attempts.push(attempt);logActivity('kuis','Menyelesaikan '+q.title);save();closeModal();renderApp();showModal('Hasil kuis',`<div class="stat">${score}/${max}</div><p>Nilai: <b>${max?Math.round(score/max*100):0}/100</b></p><p class="muted">Jawaban benar: ${q.questions.filter((question,i)=>answers[i]!=null&&answers[i]===question.answer).length} · Salah/kosong: ${q.questions.filter((question,i)=>answers[i]==null||answers[i]!==question.answer).length}</p>`,'Tutup',()=>{closeModal();renderApp()})})}
function quizResults(qid){let q=state.quizzes.find(x=>x.id===qid);if(!q)return;let attempts=state.attempts.filter(a=>a.quizId===qid);showModal('Hasil: '+q.title,attempts.length?`<div class="table-wrap"><table><thead><tr><th>Siswa</th><th>Benar</th><th>Salah/kosong</th><th>Nilai</th></tr></thead><tbody>${attempts.map(a=>{let correct=q.questions.filter((x,i)=>a.answers[i]!=null&&a.answers[i]===x.answer).length;return `<tr><td>${esc(userBy(a.studentId)?.name||'—')}</td><td>${correct}</td><td>${q.questions.length-correct}</td><td>${Math.round(a.score/a.maxScore*100)}</td></tr>`}).join('')}</tbody></table></div>`:empty('Belum ada siswa mengerjakan kuis.'),'Tutup',()=>closeModal())}
function submitTask(aid){let a=state.assignments.find(x=>x.id===aid);if(!a)return;showModal('Kumpulkan tugas: '+a.title,`<p class="muted">${esc(a.description)}</p><div class="field"><label>Jawaban teks (opsional)</label><textarea name="answer" placeholder="Tulis jawaban atau keterangan..."></textarea></div><div class="field"><label>Tautan hasil kerja (opsional)</label><input name="link" type="url" placeholder="https://..."></div><div class="field"><label>Unggah file (opsional, maksimal 1,5 MB pada demo)</label><input name="file" type="file"></div><div class="notice">Pastikan jawaban sudah siap sebelum dikumpulkan. Versi demo menyimpan file kecil di browser.</div>`,'Kumpulkan',async f=>{let file=f.get('file'),fileData='';if(!f.get('answer').trim()&&!f.get('link')&&(!file||!file.size)){toast('Isi jawaban, tautan, atau unggah file.');return}if(file&&file.size>1_500_000){toast('File demo maksimal 1,5 MB.');return}if(file&&file.size)fileData=await readFile(file);let sub={id:id(),assignmentId:aid,studentId:current.id,answer:f.get('answer'),link:f.get('link'),fileName:file?.name||'',fileData,date:new Date().toISOString(),grade:null,feedback:''};state.submissions.push(sub);logActivity('pengumpulan','Mengumpulkan '+a.title);save();closeModal();renderApp();toast('Tugas berhasil dikumpulkan.')})}

function studentAnalysis(sid){let s=userBy(sid);if(!s)return;let subs=state.submissions.filter(x=>x.studentId===sid),graded=subs.filter(x=>x.grade!=null),avg=graded.length?Math.round(graded.reduce((n,x)=>n+Number(x.grade),0)/graded.length):null;let prompt=`Bantu saya menyusun evaluasi pembelajaran yang objektif untuk siswa ${s.name}. Data yang tercatat: kelas ${className(s.classId)}, jumlah tugas terkumpul ${subs.length}, tugas yang sudah dinilai ${graded.length}, rata-rata nilai ${avg==null?'belum tersedia':avg+'/100'}. Bedakan fakta dan dugaan, lalu sarankan tindak lanjut yang konstruktif.`;currentPage='ai';renderApp();setTimeout(()=>{let ta=$('#aiForm textarea');if(ta)ta.value=prompt},50)}

case'deactivateUser':{let u=userBy(d);if(u&&confirm('Nonaktifkan/hapus akun '+u.name+'? Data riwayat terkait dapat tetap tersimpan.')){state.users=state.users.filter(x=>x.id!==d);audit('Nonaktifkan pengguna',u.name);save();renderApp();toast('Pengguna dihapus dari daftar aktif.')}break}
case'openClassModal':openClassModal();break;case'editClass':openClassModal(state.classes.find(c=>c.id===d));break;
case'classStudents':{let c=state.classes.find(x=>x.id===d);showModal('Siswa '+c.name,`${state.users.filter(u=>u.role==='student'&&u.classId===d).map(u=>`<div class="schedule-item"><div style="flex:1"><b>${esc(u.name)}</b><div class="muted">${esc(u.username||'')}</div></div>${btn('Pindahkan','moveStudent','secondary small',`data-id="${u.id}" data-class="${d}"`)}</div>`).join('')||empty('Belum ada siswa di kelas ini.')}${btn('＋ Tambah siswa ke kelas','addStudentClass','primary',`data-class="${d}"`)}`,'Tutup',()=>closeModal());break}
case'addStudentClass':{let cid=b.dataset.class;closeModal();showModal('Tambah siswa',`${field('Nama siswa','name')}${field('Username (opsional)','username')}${field('PIN siswa','pin','','text','Buat PIN pribadi')}`, 'Tambah',f=>{if(!f.get('name').trim()){toast('Nama siswa wajib.');return}state.users.push({id:id(),name:f.get('name').trim(),username:f.get('username').trim(),role:'student',classId:cid,pin:f.get('pin'),approved:true});save();closeModal();renderApp();toast('Siswa ditambahkan.')});break}
case'moveStudent':{let u=userBy(d);closeModal();if(u){showModal('Pindahkan siswa',selectField('Kelas tujuan','classId',state.classes.map(c=>({value:c.id,label:c.name})),u.classId),'Pindahkan',f=>{u.classId=f.get('classId');save();closeModal();renderApp();toast('Kelas siswa diperbarui.')})}break}
case'openScheduleModal':openScheduleModal();break;case'editSchedule':openScheduleModal(state.schedules.find(x=>x.id===d));break;case'deleteSchedule':if(confirm('Hapus jadwal ini?')){state.schedules=state.schedules.filter(x=>x.id!==d);save();renderApp()}break;
case'openMaterialModal':openMaterialModal();break;case'editMaterial':openMaterialModal(state.materials.find(x=>x.id===d));break;case'deleteMaterial':if(confirm('Hapus materi ini?')){state.materials=state.materials.filter(x=>x.id!==d);save();renderApp()}break;case'viewMaterial':viewMaterial(d);break;
case'openAssignmentModal':openAssignmentModal();break;case'editAssignment':openAssignmentModal(state.assignments.find(x=>x.id===d));break;case'submitTask':submitTask(d);break;case'viewSubmission':viewSubmission(d);break;case'gradeSubmission':gradeSubmission(d);break;case'assignmentSubs':assignmentSubs(d);break;
case'openQuizModal':openQuizModal();break;case'editQuiz':editQuiz(d);break;case'openKeyModal':openKeyModal(d||null);break;case'takeQuiz':takeQuiz(d);break;case'quizResults':quizResults(d);break;case'addQuestion':{let q=state.quizzes.find(x=>x.id===d);if(q){q.questions.push({q:'Soal baru',options:['Pilihan A','Pilihan B','Pilihan C','Pilihan D'],answer:0,points:10});save();editQuiz(d)}break}
case'openAnnouncementModal':announcementModal();break;case'deleteAnnouncement':if(confirm('Hapus pengumuman ini?')){state.announcements=state.announcements.filter(x=>x.id!==d);save();renderApp()}break;
case'clearBackground':state.settings.background='';save();renderApp();toast('Background dihapus.');break;case'previewLogin':current=null;renderLogin();break;case'exportData':exportData();break;case'importBackup':$('#backupFile').click();break;
case'exportUsersCSV':exportCSV('pengguna-lms.csv',[['Nama','Username','Peran','Kelas','Mata Pelajaran','Status'],...state.users.map(u=>[u.name,u.username,u.role,className(u.classId),u.subject,u.approved?'Aktif':'Menunggu'])]);break;
case'exportGradesCSV':exportCSV('nilai-lms.csv',[['Siswa','Kelas','Tugas','Nilai','Umpan Balik','Tanggal'],...state.submissions.filter(s=>s.grade!=null).map(s=>[userBy(s.studentId)?.name,className(userBy(s.studentId)?.classId),state.assignments.find(a=>a.id===s.assignmentId)?.title,s.grade,s.feedback,s.date])]);break;
case'saveModules':state.settings.modules={};document.querySelectorAll('[data-module]').forEach(x=>state.settings.modules[x.dataset.module]=x.checked);save();toast('Pengaturan modul disimpan.');break;
case'deleteSubject':if(confirm('Hapus mata pelajaran ini?')){state.subjects=state.subjects.filter(x=>x.id!==d);save();renderApp()}break;
case'studentAnalysis':studentAnalysis(d);break;
case'aiQuick':{let p=b.dataset.prompt;let h=$('#chatHistory');h.innerHTML+=`<div style="text-align:right;margin:10px 0"><span class="pill">${esc(p)}</span></div><div class="notice" style="margin:10px 0">${aiReply(p)}</div>`;h.scrollTop=h.scrollHeight;break}
}
});
document.addEventListener('submit',e=>{
if(e.target.id==='subjectForm'){e.preventDefault();let f=new FormData(e.target);if(!f.get('name').trim()){toast('Nama mata pelajaran wajib.');return}state.subjects.push({id:id(),name:f.get('name').trim(),classId:f.get('classId'),teacherId:f.get('teacherId')});save();renderApp();toast('Mata pelajaran ditambahkan.')}
if(e.target.id==='settingsForm'){e.preventDefault();let f=new FormData(e.target);state.settings.name=f.get('name').trim()||'EduSmart LMS';state.settings.school=f.get('school');state.settings.tagline=f.get('tagline');state.settings.heroText=f.get('heroText');state.settings.logo=f.get('logo')||'E';let theme=f.get('theme');if(/^#[0-9a-fA-F]{6}$/.test(theme))state.settings.theme=theme;save();renderApp();toast('Pengaturan tampilan disimpan.')}
if(e.target.id==='profileForm'){e.preventDefault();let f=new FormData(e.target);current.name=f.get('name').trim()||current.name;current.username=f.get('username').trim()||current.username;if(current.role==='student')current.classId=f.get('classId');else current.subject=f.get('subject');if(f.get('pin'))current.pin=f.get('pin');if(f.get('newPassword'))current.password=f.get('newPassword');save();renderApp();toast('Profil diperbarui.')}
if(e.target.id==='aiForm'){e.preventDefault();let f=new FormData(e.target),p=f.get('prompt').trim();if(!p)return;let h=$('#chatHistory');h.innerHTML+=`<div style="text-align:right;margin:10px 0"><span class="pill">${esc(p)}</span></div><div class="notice" style="margin:10px 0">${aiReply(p)}</div>`;h.scrollTop=h.scrollHeight;e.target.reset()}
});
document.addEventListener('change',async e=>{
if(e.target.id==='userFilter'){window.userFilter=e.target.value;usersRefresh()}
if(e.target.id==='userSearch')usersRefresh();
if(e.target.id==='backgroundUpload'){let file=e.target.files[0];if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Pilih file JPG, PNG, atau WebP.');return}if(file.size>1_500_000){toast('Gambar demo maksimal 1,5 MB. Kompres gambar terlebih dahulu.');return}try{state.settings.background=await readFile(file);save();renderApp();toast('Background halaman awal diperbarui.')}catch(err){toast('Gagal membaca gambar.')} }
if(e.target.id==='analysisClass'){window.analysisClass=e.target.value;renderApp()}
if(e.target.id==='importUsers'){let file=e.target.files[0];if(!file)return;let text=await file.text(),lines=text.split(/\r?\n/).filter(Boolean),headers=lines.shift().split(',').map(x=>x.trim().toLowerCase());let added=0;lines.forEach(line=>{let vals=line.split(',').map(x=>x.trim()),o={};headers.forEach((h,i)=>o[h]=vals[i]||'');if(o.name&&['student','teacher','admin'].includes(o.role)&&!state.users.some(u=>u.username&&u.username===o.username)){state.users.push({id:id(),name:o.name,username:o.username,password:o.password||'',role:o.role,classId:o.classid||'',subject:o.subject||'',approved:o.role==='student'});added++}});save();renderApp();toast(added+' pengguna diimpor. Periksa akun sebelum digunakan.')}
if(e.target.id==='keyCsv'){toast('Gunakan tombol Koreksi kunci eksternal untuk meninjau hasil pembacaan kunci.')}
if(e.target.id==='backupFile'){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.users||!obj.settings)throw Error();if(confirm('Impor backup akan mengganti data demo saat ini. Lanjutkan?')){state=obj;save();current=null;renderLogin();toast('Backup berhasil diimpor.')}}catch(err){toast('File backup tidak valid.')} }
});
load();ensureAccountingClasses();save();renderLogin();
})();
</script>
</body>
</html>
